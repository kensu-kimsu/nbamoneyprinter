name: Test HaterPicks NBA odds

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test NBA odds feed
        env:
          HATERPICKS_API_KEY: ${{ secrets.HATERPICKS_API_KEY }}
        run: python -m integrations.haterpicks
