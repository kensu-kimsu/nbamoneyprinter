name: NBA Money Printer - automatic daily paper trading
on:
  workflow_dispatch:
  schedule:
    - cron: '10 15 * * *'
permissions:
  contents: write
concurrency:
  group: nba-paper-ledger
  cancel-in-progress: false
jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install AI model dependencies
        run: python -m pip install --disable-pip-version-check numpy==1.26.4 scikit-learn==1.4.2
      - name: Generate new NBA predictions
        run: python -m research.espn_baseline
      - name: Install optional free OddsHarvester scraper
        continue-on-error: true
        run: |
          python -m pip install oddsharvester
          python -m playwright install --with-deps chromium
      - name: Scrape free public NBA moneylines
        continue-on-error: true
        timeout-minutes: 5
        run: python -m research.scrape_free_odds
      - name: Show scraper output and available raw files
        if: always()
        run: |
          echo 'External odds files:'
          find research/external_odds -maxdepth 2 -type f -printf '%p %s bytes\\n' 2>/dev/null || true
          python - <<'PY'
          import json, pathlib
          for path in pathlib.Path('research/external_odds').glob('*.json'):
              try:
                  value=json.loads(path.read_text())
                  print(path, 'top-level type:', type(value).__name__)
                  if isinstance(value,dict):
                      print('top-level keys:', list(value)[:25])
                      for key in ('matches','games','events','data'):
                          obj=value.get(key)
                          if isinstance(obj,list) and obj:
                              print(key, 'first item:', str(obj[0])[:2000])
                  elif isinstance(value,list) and value:
                      print('first item:', str(value[0])[:2000])
              except Exception as exc:
                  print(path, type(exc).__name__, str(exc)[:200])
          PY
      - name: Merge free bookmaker odds and report full-slate coverage
        id: odds
        continue-on-error: true
        run: python -m research.merge_free_odds
      - name: Create virtual bets only when fresh odds are available
        if: steps.odds.outcome == 'success'
        run: python -m paper_betting.place_espn_bets
      - name: Save predictions, odds audit and virtual bets
        if: always()
        run: |
          git add research/live_predictions/ research/espn_odds_snapshots/ paper_betting/ledger.csv
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Run automatic NBA predictions, odds and paper bets'
            git pull --rebase origin master
            git push origin master
          fi
      - name: Upload free odds scraper diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: free-nba-odds-diagnostics
          path: |
            research/external_odds/
            research/espn_odds_snapshots/
          if-no-files-found: ignore
          retention-days: 7
      - name: Report missing bookmaker odds
        if: steps.odds.outcome == 'failure'
        run: echo 'No verified prices for this slate; virtual bets skipped safely.'
