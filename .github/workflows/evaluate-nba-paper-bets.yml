name: Evaluate NBA AI paper bets
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Generate NBA AI predictions (ESPN baseline)"]
    types: [completed]
permissions:
  contents: read
jobs:
  evaluate:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check real game matching, price freshness and paper bet eligibility
        run: python -m paper_betting.select_bets
